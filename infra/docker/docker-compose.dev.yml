name: rootsearch-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: rootsearch
      MONGO_INITDB_ROOT_PASSWORD: rootsearch
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://rootsearch:rootsearch@mongo:27017/rootsearch?authSource=admin
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TRANSCRIPTION_MODE: LOCAL
      LOCAL_TRANSCRIPTION_ENDPOINT: http://host.docker.internal:8000/api/transcribe
      CONTENT_GENERATION_MODE: LOCAL
      LM_STUDIO_URL: http://host.docker.internal:1234
    ports:
      - "3001:3001"
    volumes:
      - ../../backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app/frontend
    depends_on:
      - backend

volumes:
  mongo_data:
